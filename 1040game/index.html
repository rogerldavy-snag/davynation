<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>The 1040 Game</title>
    <meta name="description" content="Think you can file a real return? Take the desk, meet the clients, build the 1040.">
    <meta property="og:title" content="The 1040 Game">
    <meta property="og:description" content="Think you can file a real return? Take the desk, meet the clients, build the 1040.">
    <meta property="og:url" content="https://davynation.com/1040game">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.75rem; }
      * { box-sizing: border-box; }
      :root {
        color-scheme: light dark;
        --bg: #e9ede8;
        --bg-deep: #dfe6dd;
        --surface: #ffffff;
        --surface-2: #f2f5f1;
        --ink: #16211a;
        --muted: #54645a;
        --line: #ccd6cc;
        --accent: #0c7a4b;
        --accent-dark: #075c38;
        --accent-soft: #e0f2e7;
        --amber: #e79b1e;
        --amber-soft: #fdf0d5;
        --red: #b3261e;
        --red-soft: #fbe7e5;
        --paper: #fffdf3;
        --paper-ink: #1d261f;
        --paper-line: #d9d2ba;
        --shadow: 0 10px 30px rgba(18, 38, 26, 0.10);
        --radius: 14px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1511;
          --bg-deep: #0a0f0b;
          --surface: #1a231c;
          --surface-2: #222d24;
          --ink: #edf3ee;
          --muted: #a3b5a8;
          --line: #33443a;
          --accent: #3ec983;
          --accent-dark: #8fe3b6;
          --accent-soft: #173527;
          --amber: #f2b13e;
          --amber-soft: #3a2d10;
          --red: #ff8a80;
          --red-soft: #40201d;
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        }
      }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Nunito", system-ui, sans-serif;
        font-size: 16.5px;
        line-height: 1.55;
      }
      h1, h2, h3, .display { font-family: "Bricolage Grotesque", "Nunito", sans-serif; line-height: 1.12; margin: 0; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
      button { font: inherit; cursor: pointer; }
      a { color: var(--accent-dark); }
      :focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; border-radius: 6px; }

      /* ---------- HUD ---------- */
      .hud {
        position: sticky; top: 0; z-index: 20;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      .hud-in {
        max-width: 1140px; margin: 0 auto; padding: 10px 16px;
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      }
      .hud-label { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 0.98rem; letter-spacing: 0.01em; margin-right: 2px; }
      .hud-label span { color: var(--accent); }
      .chip {
        display: inline-flex; align-items: center; gap: 6px;
        background: var(--surface-2); border: 1px solid var(--line);
        border-radius: 999px; padding: 5px 12px; font-size: 0.86rem; font-weight: 700;
        min-height: 2rem;
      }
      .chip b { font-family: "IBM Plex Mono", monospace; font-weight: 600; }
      .chip.gold { background: var(--amber-soft); border-color: var(--amber); }
      .season-dots { display: inline-flex; gap: 5px; align-items: center; }
      .season-dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); display: block; }
      .season-dots i.done { background: var(--accent); }
      .season-dots i.now { background: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
      .hud-spacer { flex: 1; }
      .byline { font-size: 0.8rem; color: var(--muted); font-weight: 700; }

      /* ---------- Layout ---------- */
      .wrap { max-width: 1140px; margin: 0 auto; padding: 20px 16px 56px; }
      .board { display: grid; grid-template-columns: 368px 1fr; gap: 18px; grid-template-areas: "aside play"; align-items: start; }
      aside.col { grid-area: aside; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
      section.play { grid-area: play; min-width: 0; }
      @media (max-width: 860px) {
        .board { grid-template-columns: 1fr; grid-template-areas: "play" "aside"; }
      }
      .card {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px;
      }

      /* ---------- Start screen ---------- */
      .start { max-width: 880px; margin: 8px auto 0; text-align: left; }
      .start-badge {
        display: inline-block; background: var(--accent); color: #fff; font-weight: 800;
        font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase;
        padding: 6px 14px; border-radius: 999px;
      }
      @media (prefers-color-scheme: dark) { .start-badge { color: #0b1510; } }
      .start h1 { font-size: clamp(2.3rem, 6vw, 3.6rem); font-weight: 800; margin: 16px 0 10px; }
      .start h1 .hl { color: var(--accent); }
      .start .lede { font-size: 1.14rem; color: var(--muted); max-width: 620px; margin: 0 0 22px; }
      .how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 0 0 22px; }
      @media (max-width: 700px) { .how { grid-template-columns: 1fr; } }
      .how-step { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
      .how-step .num {
        width: 34px; height: 34px; border-radius: 50%; background: var(--amber-soft);
        border: 1.5px solid var(--amber); color: var(--ink); font-weight: 800;
        display: flex; align-items: center; justify-content: center; margin-bottom: 8px;
        font-family: "IBM Plex Mono", monospace;
      }
      .how-step h3 { font-size: 1.02rem; margin-bottom: 4px; }
      .how-step p { margin: 0; font-size: 0.92rem; color: var(--muted); }
      .states { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 0 0 22px; }
      @media (max-width: 980px) { .states { grid-template-columns: repeat(2, 1fr); } }
      @media (max-width: 700px) { .states { grid-template-columns: 1fr; } }
      .state-card { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--accent); border-radius: 12px; padding: 16px; }
      .state-card h3 { font-size: 1.02rem; margin-bottom: 4px; }
      .state-card p { margin: 0; font-size: 0.92rem; color: var(--muted); }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        border: none; border-radius: 11px; padding: 13px 26px;
        font-weight: 800; font-size: 1.02rem; text-decoration: none;
        background: var(--accent); color: #fff; transition: transform 0.12s ease, background 0.12s ease;
      }
      @media (prefers-color-scheme: dark) { .btn { color: #0b1510; } }
      .btn:hover { background: var(--accent-dark); }
      @media (prefers-color-scheme: dark) { .btn:hover { background: var(--accent); } }
      .btn:active { transform: scale(0.98); }
      .btn.amber { background: var(--amber); color: #221a06; }
      .btn.amber:hover { background: #d98d12; }
      .btn.ghost { background: transparent; color: var(--accent-dark); border: 2px solid var(--accent); }
      .btn.big { font-size: 1.13rem; padding: 16px 32px; }
      .share-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
      .share-status { font-size: 0.9rem; font-weight: 700; color: var(--accent-dark); }
      .fineprint { font-size: 0.85rem; color: var(--muted); margin-top: 16px; }
      .disclaimer {
        background: var(--amber-soft); border: 1.5px solid var(--amber); border-radius: 12px;
        padding: 14px 16px; margin: 0 0 22px; font-size: 0.98rem; line-height: 1.5;
      }
      .disclaimer b { font-family: "Bricolage Grotesque", sans-serif; }
      .creator { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 0.9rem; color: var(--muted); }
      .creator b { color: var(--ink); }

      /* ---------- Client card ---------- */
      .client-head { display: flex; gap: 14px; align-items: center; }
      .avatar {
        width: 58px; height: 58px; border-radius: 50%; flex: none;
        display: flex; align-items: center; justify-content: center;
        font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 1.25rem; color: #fff;
      }
      @media (prefers-color-scheme: dark) { .avatar { color: #0d130e; } }
      .client-head h2 { font-size: 1.3rem; }
      .client-tag { color: var(--muted); font-size: 0.9rem; font-weight: 700; }
      .client-story { margin: 12px 0 0; font-size: 0.96rem; }
      .fact-list { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
      .fact-list li {
        background: var(--accent-soft); border-radius: 9px; padding: 9px 12px; font-size: 0.9rem; font-weight: 600;
        animation: pop 0.25s ease;
      }
      .fact-list li::before { content: "Found: "; font-weight: 800; color: var(--accent-dark); }
      .fact-empty { font-size: 0.88rem; color: var(--muted); margin: 12px 0 0; font-style: italic; }

      /* ---------- Documents ---------- */
      .col h3.sec { font-size: 0.82rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
      .doc {
        background: var(--paper); color: var(--paper-ink);
        border: 1px solid var(--paper-line); border-radius: 6px;
        padding: 14px 16px; margin-bottom: 12px;
        box-shadow: 0 3px 10px rgba(30, 30, 10, 0.10);
        animation: pop 0.25s ease;
      }
      .doc-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--paper-ink); padding-bottom: 6px; margin-bottom: 8px; }
      .doc-head b { font-family: "Bricolage Grotesque", sans-serif; font-size: 1.02rem; }
      .doc-head span { font-size: 0.78rem; font-weight: 700; color: #6b6455; }
      .doc-row { display: flex; justify-content: space-between; gap: 10px; font-size: 0.86rem; padding: 3px 0; border-bottom: 1px dotted var(--paper-line); }
      .doc-row:last-child { border-bottom: none; }
      .doc-row .v { font-family: "IBM Plex Mono", monospace; font-weight: 600; white-space: nowrap; }

      /* ---------- 1040 form ---------- */
      .form1040 { background: var(--paper); color: var(--paper-ink); border: 1px solid var(--paper-line); border-radius: 6px; padding: 16px; box-shadow: 0 3px 10px rgba(30,30,10,0.10); }
      .form1040 .f-head { border-bottom: 3px double var(--paper-ink); padding-bottom: 8px; margin-bottom: 6px; }
      .form1040 .f-head b { font-family: "Bricolage Grotesque", sans-serif; font-size: 1.05rem; }
      .form1040 .f-head span { display: block; font-size: 0.78rem; color: #6b6455; font-weight: 700; }
      .f-row { display: flex; gap: 8px; align-items: baseline; padding: 6px 4px; border-bottom: 1px solid var(--paper-line); font-size: 0.86rem; }
      .f-row .ln { font-family: "IBM Plex Mono", monospace; font-weight: 600; background: var(--paper-ink); color: var(--paper); border-radius: 4px; padding: 1px 7px; font-size: 0.78rem; flex: none; }
      .f-row .lb { flex: 1; }
      .f-row .fv { font-family: "IBM Plex Mono", monospace; font-weight: 600; white-space: nowrap; }
      .f-row.filled { background: #eef6df; }
      .f-row.active { background: var(--amber-soft); outline: 2px dashed var(--amber); outline-offset: -2px; }
      .f-row .blank { color: #a49a7d; letter-spacing: 0.1em; }

      /* ---------- Play panel ---------- */
      .phase-tag {
        display: inline-block; font-size: 0.78rem; font-weight: 800; letter-spacing: 0.09em;
        text-transform: uppercase; padding: 5px 12px; border-radius: 999px; margin-bottom: 12px;
      }
      .phase-tag.interview { background: var(--amber-soft); border: 1px solid var(--amber); }
      .phase-tag.form { background: var(--accent-soft); border: 1px solid var(--accent); }
      .phase-tag.result { background: var(--accent); color: #fff; }
      @media (prefers-color-scheme: dark) { .phase-tag.result { color: #0b1510; } }
      .play h2 { font-size: 1.45rem; margin-bottom: 8px; }
      .play .prompt { font-size: 1.03rem; margin: 0 0 6px; }
      .play .help { color: var(--muted); font-size: 0.93rem; margin: 0 0 16px; }
      .speech {
        background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px;
        padding: 14px 16px; margin: 0 0 18px; font-size: 1rem;
      }
      .speech b { color: var(--accent-dark); }
      .opts { display: flex; flex-direction: column; gap: 10px; }
      .opt {
        text-align: left; background: var(--surface); border: 2px solid var(--line);
        border-radius: 11px; padding: 14px 16px; font-weight: 700; font-size: 1rem;
        display: flex; justify-content: space-between; align-items: center; gap: 12px;
        transition: border-color 0.12s ease, background 0.12s ease;
        width: 100%;
      }
      .opt:hover:not(:disabled) { border-color: var(--accent); }
      .opt .val { font-family: "IBM Plex Mono", monospace; font-weight: 600; }
      .opt.good { border-color: var(--accent); background: var(--accent-soft); }
      .opt.bad { border-color: var(--red); background: var(--red-soft); }
      .opt:disabled { cursor: default; opacity: 0.92; }
      .feedback { border-radius: 11px; padding: 14px 16px; margin-top: 16px; font-size: 0.97rem; animation: pop 0.25s ease; }
      .feedback.good { background: var(--accent-soft); border: 1px solid var(--accent); }
      .feedback.bad { background: var(--red-soft); border: 1px solid var(--red); }
      .feedback b { display: block; margin-bottom: 3px; font-family: "Bricolage Grotesque", sans-serif; }
      .feedback .btn { margin-top: 12px; }
      .points-pop { font-family: "IBM Plex Mono", monospace; font-weight: 600; color: var(--accent-dark); }

      /* ---------- Result ---------- */
      .refund-hero { text-align: center; padding: 18px 10px 8px; }
      .refund-hero .big { font-family: "IBM Plex Mono", monospace; font-size: clamp(2.2rem, 7vw, 3.2rem); font-weight: 600; color: var(--accent-dark); }
      .refund-hero .cap { font-weight: 800; font-size: 1.05rem; }
      .refund-hero.owes .big { color: var(--red); }
      .refund-dual { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0 6px; }
      @media (max-width: 640px) { .refund-dual { grid-template-columns: 1fr; } }
      .refund-box { text-align: center; padding: 16px 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
      .refund-box .jurisdiction { display: block; font-size: 0.76rem; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
      .refund-box .big { font-family: "IBM Plex Mono", monospace; font-size: clamp(1.8rem, 5.5vw, 2.5rem); font-weight: 600; color: var(--accent-dark); line-height: 1.15; }
      .refund-box.owes .big { color: var(--red); }
      .refund-box.zero .big { color: var(--ink); }
      .refund-box .cap { font-weight: 800; font-size: 0.98rem; margin-top: 4px; }
      .refund-box .sub { font-size: 0.86rem; color: var(--muted); margin-top: 3px; }
      .refund-stamp-wrap { text-align: center; }
      .stamp {
        display: inline-block; border: 3px solid var(--accent); color: var(--accent-dark);
        font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; letter-spacing: 0.12em;
        padding: 6px 18px; border-radius: 8px; transform: rotate(-3deg); margin: 10px 0 4px; text-transform: uppercase;
      }
      .lesson { background: var(--amber-soft); border: 1px solid var(--amber); border-radius: 11px; padding: 14px 16px; margin: 16px 0; font-size: 0.97rem; }
      .lesson b { font-family: "Bricolage Grotesque", sans-serif; }
      .result-stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0 18px; }

      /* ---------- Ads ---------- */
      .ad-banner {
        margin-top: 18px; border: 1.5px dashed var(--amber); background: var(--amber-soft);
        border-radius: 12px; padding: 12px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
      }
      .ad-banner .ad-txt { flex: 1; min-width: 200px; font-size: 0.92rem; }
      .ad-banner .ad-txt b { font-family: "Bricolage Grotesque", sans-serif; font-size: 1rem; }
      .ad-banner .ad-kicker { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 2px; }
      .ad-banner a.btn { padding: 10px 18px; font-size: 0.92rem; }
      .spotlight { background: #0d3d27; color: #eafaf0; border-radius: var(--radius); padding: 26px; box-shadow: var(--shadow); }
      @media (prefers-color-scheme: dark) { .spotlight { background: #0a2e1e; border: 1px solid var(--line); } }
      .spotlight .ad-kicker { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #f2b13e; display: block; margin-bottom: 10px; }
      .spotlight h2 { color: #fff; font-size: 1.7rem; margin-bottom: 8px; }
      .spotlight p { color: #cfe8d8; margin: 0 0 18px; max-width: 520px; }
      .spotlight .price { font-family: "IBM Plex Mono", monospace; font-size: 1.3rem; color: #f2b13e; font-weight: 600; margin-bottom: 16px; display: block; }
      .spotlight .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
      .spotlight .btn.ghost { border-color: #eafaf0; color: #eafaf0; }

      .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 18px; }
      @media (max-width: 700px) { .product-grid { grid-template-columns: 1fr; } }
      .product { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; gap: 14px; }
      .cover { width: 74px; height: 104px; border-radius: 5px; flex: none; padding: 9px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: inset 4px 0 0 rgba(0,0,0,0.18), 0 4px 10px rgba(0,0,0,0.18); }
      .cover .ct { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 0.72rem; line-height: 1.25; }
      .cover .cs { font-size: 0.58rem; font-weight: 700; opacity: 0.85; line-height: 1.3; }
      .cover.playbook { background: #14342a; color: #f5d67a; }
      .cover.coloring { background: #ffd23e; color: #4a2f00; }
      .cover.tour { background: #2e7ea6; color: #fff8e6; }
      .cover.tax { background: #ece7da; color: #14342a; }
      .product h3 { font-size: 1.02rem; margin-bottom: 4px; }
      .product p { font-size: 0.88rem; color: var(--muted); margin: 0 0 10px; }
      .product .price { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 0.9rem; display: block; margin-bottom: 8px; }
      .product a { font-weight: 800; font-size: 0.92rem; }

      .grade { font-size: clamp(1.9rem, 5vw, 2.6rem); }
      .stars { font-size: 1.6rem; letter-spacing: 0.2em; color: var(--amber); margin: 6px 0; }
      .hidden { display: none !important; }
      .timer-wrap { margin: 0 0 16px; }
      .timer-label { display: flex; justify-content: space-between; font-size: 0.82rem; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
      .timer-label b { font-family: "IBM Plex Mono", monospace; color: var(--red); }
      .timer-bar { height: 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
      .timer-fill { height: 100%; background: var(--amber); border-radius: 999px; transition: width 0.25s linear; }
      .timer-fill.low { background: var(--red); }
      .mode-banner { border-radius: 11px; padding: 12px 16px; margin: 0 0 16px; font-size: 0.95rem; animation: pop 0.25s ease; }
      .mode-banner.challenge { background: #40201d; background: var(--red-soft); border: 1.5px solid var(--red); }
      .mode-banner.coach { background: var(--accent-soft); border: 1.5px solid var(--accent); }
      .mode-banner b { font-family: "Bricolage Grotesque", sans-serif; }
      .hint-box { background: var(--surface-2); border-left: 4px solid var(--accent); border-radius: 0 10px 10px 0; padding: 10px 14px; font-size: 0.92rem; margin: 0 0 16px; }
      .hint-box b { color: var(--accent-dark); }
      .doc.decoy { opacity: 0.75; border-style: dashed; }
      .doc-note { font-size: 0.85rem; font-weight: 700; color: var(--red); margin: 0 0 10px; }
      .key-input {
        width: 100%; padding: 13px 14px; font-family: "IBM Plex Mono", monospace; font-size: 1rem;
        border-radius: 10px; border: 2px solid #3a5a48; background: #0a2e1e; color: #eafaf0;
        letter-spacing: 0.04em; text-transform: uppercase;
      }
      .key-input::placeholder { color: #7fa68d; text-transform: none; letter-spacing: 0; }
      .gate-list { text-align: left; margin: 0 0 18px; padding-left: 20px; color: #cfe8d8; }
      .gate-list li { margin-bottom: 6px; }
      .gate-options { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 18px 0 6px; }
      @media (max-width: 700px) { .gate-options { grid-template-columns: 1fr; } }
      .gate-opt { background: rgba(255,255,255,0.07); border: 1.5px solid rgba(255,255,255,0.28); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; }

      function shuffle(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
        return a;
      }
      function buildOrder() {
        var tiers = {};
        CLIENTS.forEach(function (c) { (tiers[c.tier] = tiers[c.tier] || []).push(c); });
        var keys = Object.keys(tiers).sort(function (a, b) { return a - b; });
        var order = [];
        var lastType = null;
        keys.forEach(function (k) {
          var group = shuffle(tiers[k]);
          if (group.length > 1 && lastType && group[0].type === lastType) { group.push(group.shift()); }
          group.forEach(function (c) { order.push(c); lastType = c.type; });
        });
        return order;
      }

          "<li><b>Florida intense case:</b> an easy Florida W-2 that turns hard, with a rental condo on Schedule E and 1099-MISC royalties from a management company</li>" +
          "<li><b>Retiree pension case:</b> a retired New York City worker with a NYCERS Form 1099-R pension, taxable to the IRS under the Internal Revenue Code and fully exempt on the New York return</li>" +
          "<li><b>State lessons throughout:</b> New York IT-201, New Jersey NJ-1040, and Delaware returns with their own up to date 2025 deductions, exemptions, and rates, plus the Florida case with no state income tax and no state return to file</li><li><b>Challenge rounds</b> with client deadlines and last year's documents mixed into the pile, <b>coach mode</b>, and your final preparer grade</li>" +
          "</ul>" +
          "<p>Enjoying the game? You can do this for real. Pick how you want to unlock the rest. Gumroad sends every buyer a unique license key with the purchase, and either key opens the full training.</p>" +
          "<div class=\"gate-options\">" +
          "<div class=\"gate-opt\"><span class=\"g-tag\">Game only</span><h3>The 1040 Game</h3><span class=\"g-price\">$69.99</span><p>Just the game: all nine training cases, challenge rounds, coach mode, and your final preparer grade. No course, no book, just the full training game.</p><a class=\"btn amber\" href=\"" + gm.url + "\" target=\"_blank\" rel=\"noopener\">Get The 1040 Game · $69.99</a></div>" +
          "<div class=\"gate-opt featured\"><span class=\"g-tag\">Best value · Includes the game</span><h3>Tax Preparer Playbook</h3><span class=\"g-price\">$199</span><p>The full course: the step by step playbook for doing this work for real, clients, interviews, forms, fees, and a full tax season, start to finish. Includes The 1040 Game.</p><a class=\"btn amber\" href=\"" + pb.url + "\" target=\"_blank\" rel=\"noopener\">Get the Playbook · $199 · includes the game</a></div>" +
          "</div>" +
          "<h3 style=\"color:#fff;margin:26px 0 8px;font-size:1.1rem;\">Have your license key?</h3>" +
          "<p style=\"margin-bottom:10px;\">Enter the key from your Gumroad receipt to unlock the full training. The gate accepts either a Playbook license key or a The 1040 Game license key. One key per buyer: your key is licensed to you only, so do not share it. Shared keys can be turned off.</p>" +
          "<input class=\"key-input\" id=\"key-input\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Example: 1A2B3C4D-5E6F7A8B-9C0D1E2F-3A4B5C6D\" aria-label=\"License key\" />" +
          "<div id=\"key-msg\"></div>" +
          "<div class=\"row\" style=\"margin-top:14px;\"><button class=\"btn amber\" id=\"unlock-btn\">Unlock full training</button>" +
          "<button class=\"textbtn\" id=\"gate-back\">" + (fromStart ? "Back to the start" : "Not now: replay the free cases") + "</button></div>" +
          "</div></div>";
        var input = document.getElementById("key-input");
        function tryUnlock() {
          var key = input.value.trim().toUpperCase();
          var msg = document.getElementById("key-msg");
          if (/^[0-9A-F]{8}-[0-9A-F]{8}-[0-9A-F]{8}-[0-9A-F]{8}$/.test(key)) {
            UNLOCKED = true;
            if (S) S.unlocked = true;
            msg.innerHTML = "<div class=\"gate-ok\">Key accepted. The full training is unlocked. Welcome to the advanced cases.</div>";
            setTimeout(function () {
              if (fromStart || !S) { S = newState(); hud.classList.remove("hidden"); startClient(); }
              else { S.ci++; hud.classList.remove("hidden"); startClient(); }
            }, 900);
          } else {
            msg.innerHTML = "<div class=\"gate-err\">That does not match the license key format on a Gumroad receipt. Check for typos and try again, or use one of the buy buttons above to get your key.</div>";
          }
        }
        document.getElementById("unlock-btn").addEventListener("click", tryUnlock);
        input.addEventListener("keydown", function (e) { if (e.key === "Enter") tryUnlock(); });
        document.getElementById("gate-back").addEventListener("click", function () {
          if (fromStart) { startScreen(); }
          else { S = newState(); hud.classList.remove("hidden"); startClient(); }
        });
        window.scrollTo(0, 0);
      }

      function startClient() {
        var c = client();
        S.phase = "intro"; S.askIdx = 0; S.stepIdx = 0;
        S.filled = {}; S.facts = []; S.docs = c.docs.slice();
        S.mistakesThisClient = 0; S.clientQuestions = 0; S.clientFirstTry = 0;
        S.mode = S.pendingMode;
        render();
      }

      function playShell(inner) {
        app.innerHTML = "<div class=\"board\">" + asideHtml() + "<section class=\"play\"><div class=\"card step-anim\">" + inner + "</div>" + bannerAdHtml() + "</section></div>";
        updateHud();
      }

      function render() {
        stopTimer();
        S.locked = false;
        var c = client();
        if (S.phase === "intro") {
          playShell(
            "<span class=\"phase-tag interview\">Training case " + (S.ci + 1) + " of " + S.order.length + "</span>" +
            "<h2>" + esc(c.name) + "</h2>" +
            "<div class=\"speech\"><b>" + esc(c.name.split(" ")[0]) + " sits down.</b> " + esc(c.story) + "</div>" +
            "<p class=\"prompt\">Your training task: run the interview, then build the return. Case fee on completion: <span class=\"mono\">" + money(c.fee) + "</span>.</p>" +
            "<p class=\"help\">" + esc(c.level) + " · Case type: " + esc(c.type) + "</p>" +
            modeBannerHtml().replace("phase", "phase") +
            "<button class=\"btn\" id=\"go\">Begin the interview</button>"
          );
          document.getElementById("go").addEventListener("click", function () { S.phase = "ask"; render(); });
        } else if (S.phase === "ask") {
          renderQuestion(c.asks[S.askIdx], true);
        } else if (S.phase === "form") {
          renderQuestion(c.steps[S.stepIdx], false);
        } else if (S.phase === "result") {
          renderResult();
        }
        window.scrollTo(0, 0);
      }

      function renderQuestion(q, isAsk) {
        var c = client();
        var tag = isAsk
          ? "<span class=\"phase-tag interview\">Interview · Question " + (S.askIdx + 1) + " of " + c.asks.length + "</span>"
          : "<span class=\"phase-tag form\">Form 1040 · Line " + esc(q.line) + "</span>";
        var speech = isAsk && q.speech ? "<div class=\"speech\"><b>" + esc(c.name.split(" ")[0]) + ":</b> “" + esc(q.speech) + "”</div>" : "";
        var timer = "";
        if (S.mode === "challenge") {
          timer = "<div class=\"timer-wrap\"><div class=\"timer-label\"><span>Client deadline</span><b id=\"timer-num\"></b></div><div class=\"timer-bar\"><div class=\"timer-fill\" id=\"timer-fill\" style=\"width:100%\"></div></div></div>";
        }
        var hint = (S.mode === "coach" && q.hint) ? "<div class=\"hint-box\"><b>Coach hint:</b> " + esc(q.hint) + "</div>" : "";
        var opts = q.options.map(function (o, i) {
          return "<button class=\"opt\" data-i=\"" + i + "\"><span>" + esc(o.t) + "</span></button>";
        }).join("");
        playShell(
          modeBannerHtml() + tag + timer +
          "<h2>" + (isAsk ? "The interview" : "Line " + esc(q.line) + " · " + esc(q.label)) + "</h2>" +
          speech +
          "<p class=\"prompt\">" + esc(q.prompt) + "</p>" +
          (q.help ? "<p class=\"help\">" + esc(q.help) + "</p>" : "") +
          hint +
          "<div class=\"opts\" id=\"opts\">" + opts + "</div><div id=\"fb\"></div>"
        );
        var btns = app.querySelectorAll("#opts .opt");
        btns.forEach(function (b) {
          b.addEventListener("click", function () { answer(q, parseInt(b.getAttribute("data-i"), 10), b, isAsk); });
        });
        if (S.mode === "challenge") startTimer(q, isAsk);
      }

      function startTimer(q, isAsk) {
        var c = client();
        var secs = Math.max(22, 52 - c.tier * 5 - Math.floor(S.bestStreak / 2));
        S.timerLeft = secs;
        var fill = document.getElementById("timer-fill");
        var num = document.getElementById("timer-num");
        if (num) num.textContent = secs + "s";
        var total = secs;
        stopTimer();
        S.timerId = setInterval(function () {
          S.timerLeft -= 0.25;
          if (fill) { fill.style.width = Math.max(0, (S.timerLeft / total) * 100) + "%"; if (S.timerLeft <= 8) fill.classList.add("low"); }
          if (num) num.textContent = Math.ceil(Math.max(0, S.timerLeft)) + "s";
          if (S.timerLeft <= 0) {
            stopTimer();
            if (!S.locked) timeOut(q, isAsk);
          }
        }, 250);
      }

      function timeOut(q, isAsk) {
        S.locked = true;
        S.attempts++; S.streak = 0; S.mistakesThisClient++;
        var correct = null;
        q.options.forEach(function (o) { if (o.ok) correct = o; });
        var fb = document.getElementById("fb");
        if (fb) {
          fb.innerHTML = "<div class=\"feedback bad\"><b>Deadline missed.</b> The client had to leave, and the moment passed. The trained answer was: “" + esc(correct.t) + "” " + esc(correct.why) + " <br><button class=\"btn\" id=\"cont\">Take it again, no clock</button></div>";
          var cont = document.getElementById("cont");
          if (cont) cont.addEventListener("click", function () { S.mode = "normal"; render(); });
        }
        var btns = app.querySelectorAll("#opts .opt");
        btns.forEach(function (b) { b.disabled = true; });
        updateHud();
      }

      function answer(q, idx, btn, isAsk) {
        if (S.locked) return;
        var opt = q.options[idx];
        S.questions++; S.clientQuestions++;
        if (S.attemptOnThis === undefined || S.attemptOnThis === null) S.attemptOnThis = 0;
        if (opt.ok) {
          S.locked = true;
          stopTimer();
          var firstTry = S.attemptOnThis === 0;
          var pts = firstTry ? 100 : (S.attemptOnThis === 1 ? 60 : 30);
          if (S.mode === "challenge" && firstTry) pts = 150;
          if (firstTry) { S.firstTry++; S.clientFirstTry++; S.streak++; if (S.streak > S.bestStreak) S.bestStreak = S.streak; }
          S.score += pts;
          btn.classList.add("good");
          var btns = app.querySelectorAll("#opts .opt");
          btns.forEach(function (b) { b.disabled = true; });
          if (!isAsk) {
            S.filled[q.line] = opt.t;
            var aside = app.querySelector("aside.col");
            if (aside) { var fresh = el(asideHtml()); aside.replaceWith(fresh); }
          }
          if (isAsk && q.reveal) {
            if (q.reveal.fact) S.facts.push(q.reveal.fact);
            if (q.reveal.doc) S.docs.push(q.reveal.doc);
            var aside2 = app.querySelector("aside.col");
            if (aside2) { var fresh2 = el(asideHtml()); aside2.replaceWith(fresh2); }
          }
          var fb = document.getElementById("fb");
          fb.innerHTML = "<div class=\"feedback good\"><b>Correct. <span class=\"points-pop\">+" + pts + " points</span></b>" + esc(opt.why) + "<br><button class=\"btn\" id=\"cont\">Continue</button></div>";
          document.getElementById("cont").addEventListener("click", function () { advance(isAsk); });
          updateHud();
        } else {
          S.attemptOnThis++;
          S.streak = 0; S.mistakesThisClient++;
          btn.classList.add("bad");
          btn.disabled = true;
          var correctOpt = null;
          q.options.forEach(function (o) { if (o.ok) correctOpt = o; });
          var fb2 = document.getElementById("fb");
          fb2.innerHTML = "<div class=\"feedback bad\"><b>Not quite. Here is where that went wrong.</b> " + esc(opt.why) +
            (correctOpt
              ? "<br><br><b>The trained answer is: “" + esc(correctOpt.t) + "”</b> " + esc(correctOpt.why) + " Pick it now, and keep the lesson, not just the lost points."
              : " Try another answer.") + "</div>";
          updateHud();
        }
      }

      function advance(isAsk) {
        S.attemptOnThis = 0;
        var c = client();
        if (isAsk) {
          if (S.askIdx < c.asks.length - 1) { S.askIdx++; }
          else { S.phase = "form"; S.stepIdx = 0; }
        } else {
          if (S.stepIdx < c.steps.length - 1) { S.stepIdx++; }
          else { S.phase = "result"; }
        }
        render();
      }

      function renderResult() {
        stopTimer();
        var c = client();
        var r = c.result;
        S.fees += c.fee;
        var owes = r.amount < 0;
        var stateAmt = (typeof r.stateAmount === "number") ? r.stateAmount : 0;
        var stateOwes = stateAmt < 0;
        var stateZero = stateAmt === 0;
        var stateLabel = r.stateLabel || "State";
        var isFlorida = stateLabel === "Florida";
        var fedCap = owes ? "Owes" : (r.amount === 0 ? "Nothing owed · no refund" : "Refund");
        var stateCap = stateOwes ? "Owes" : (stateZero ? (isFlorida ? "Florida has no state income tax" : "Nothing owed · no refund") : "Refund");
        var stateSub = isFlorida ? "Florida has no state income tax · No state income tax return to file · $0 tax · $0 withheld · Nothing owed, no refund" : (stateZero ? "Tax $0 · nothing withheld to refund" : "");
        var clean = S.mistakesThisClient === 0;
        if (clean) S.pendingMode = "challenge";
        else if (S.mistakesThisClient >= 3) S.pendingMode = "coach";
        else S.pendingMode = "normal";
        var nextNote = S.ci >= S.order.length - 1 ? "" :
          (S.pendingMode === "challenge" ? "<p class=\"help\">Clean case. Your next client arrives as a challenge round: deadlines on, trickier documents, bonus points.</p>" :
           S.pendingMode === "coach" ? "<p class=\"help\">That case had some bumps. Your next client comes with coach mode: extra hints on every question while you rebuild.</p>" :
           "<p class=\"help\">Next client coming up, a step further into the season.</p>");
        app.innerHTML = "<div class=\"board\">" + asideHtml() + "<section class=\"play\"><div class=\"card step-anim\">" +
          "<span class=\"phase-tag result\">Return filed</span>" +
          "<h2 style=\"margin-top:4px;\">" + esc(c.name) + " · Federal and state results</h2>" +
          "<p class=\"help\">Both results, shown separately. The federal result never includes the state result, and the state result never includes the federal one.</p>" +
          "<div class=\"refund-dual\">" +
          "<div class=\"refund-box" + (owes ? " owes" : (r.amount === 0 ? " zero" : "")) + "\"><span class=\"jurisdiction\">Federal · Form 1040</span><div class=\"big\">" + money(r.amount) + "</div><div class=\"cap\">" + fedCap + "</div></div>" +
          "<div class=\"refund-box" + (stateOwes ? " owes" : (stateZero ? " zero" : "")) + "\"><span class=\"jurisdiction\">" + esc(stateLabel) + "</span><div class=\"big\">" + money(stateAmt) + "</div><div class=\"cap\">" + stateCap + "</div>" + (stateSub ? "<div class=\"sub\">" + esc(stateSub) + "</div>" : "") + "</div>" +
          "</div>" +
          "<div class=\"refund-stamp-wrap\"><div class=\"stamp\">Accepted</div></div>" +
          "<div class=\"result-stats\"><span class=\"chip\">Case fee <b>" + money(c.fee) + "</b></span><span class=\"chip\">First try answers <b>" + S.clientFirstTry + " of " + S.clientQuestions + "</b></span><span class=\"chip gold\">Score <b>" + S.score.toLocaleString("en-US") + "</b></span></div>" +
          "<div class=\"lesson\"><b>Training note:</b> " + esc(r.lesson) + "</div>" +
          nextNote +
          "<button class=\"btn\" id=\"next\">" + (S.ci >= S.order.length - 1 ? "Finish training session" : (!S.unlocked && S.ci === FREE_COUNT - 1 ? "Continue: unlock the full training" : "Next client")) + "</button>" +
          "<div class=\"share-row\"><button class=\"btn ghost\" id=\"share-btn-result\" type=\"button\">Share The 1040 Game</button><span class=\"share-status\" id=\"share-status-result\" role=\"status\" aria-live=\"polite\"></span></div>" +
          "</div>" + bannerAdHtml() + "</section></div>";
        updateHud();
        document.getElementById("share-btn-result").addEventListener("click", function () { shareGame("share-status-result"); });
        document.getElementById("next").addEventListener("click", function () {
          if (S.ci >= S.order.length - 1) { finalScreen(); }
          else if (!S.unlocked && S.ci === FREE_COUNT - 1) { gateScreen(false); }
          else { breakScreen(); }
        });
        window.scrollTo(0, 0);
      }

      function breakScreen() {
        stopTimer();
        var p = productById(BREAK_ORDER[S.breakCount % BREAK_ORDER.length]);
        S.breakCount++;
        var isPlaybook = p.id === "playbook";
        app.innerHTML = "<div style=\"max-width:760px;margin:10px auto 0;\"><div class=\"spotlight step-anim\">" +
          "<span class=\"ad-kicker\">Training break · From Genextra LLC</span>" +
          (isPlaybook
            ? "<h2>Enjoying the game? You can do this for real.</h2><p>Everything you just practiced, the interview, the forms, the credits, is a real service people pay for every tax season. The Tax Preparer Playbook teaches the business end to end.</p><span class=\"price\">" + esc(p.price) + "</span>"
            : "<h2>" + esc(p.name) + "</h2><p>" + esc(p.desc) + "</p><span class=\"price\">" + esc(p.price) + "</span>") +
          "<div class=\"row\"><a class=\"btn amber\" href=\"" + p.url + "\" target=\"_blank\" rel=\"noopener\">" + (isPlaybook ? "Tax Preparer Playbook" : esc(p.cta)) + "</a>" +
          "<button class=\"btn ghost\" id=\"back\">Back to training</button></div>" +
          "</div></div>";
        document.getElementById("back").addEventListener("click", function () { S.ci++; startClient(); });
        window.scrollTo(0, 0);
      }

      function finalScreen() {
        stopTimer();
        hud.classList.add("hidden");
        var totalQ = S.questions || 1;
        var acc = Math.round((S.firstTry / totalQ) * 100);
        var grade, stars, note;
        if (acc >= 85) { grade = "Master Preparer"; stars = "★★★★★"; note = "Clean interviews, right credits, right lines. You are ready to train on real returns."; }
        else if (acc >= 65) { grade = "Pro Preparer"; stars = "★★★★☆"; note = "Strong work. A few answers needed a second look, and that is exactly what training is for."; }
        else if (acc >= 45) { grade = "Junior Preparer"; stars = "★★★☆☆"; note = "You finished every return. The reps are working. Another session will tighten the interview habits."; }
        else { grade = "Trainee"; stars = "★★☆☆☆"; note = "Every expert started here. The cases taught the questions; run the session again and watch the score climb."; }
        var grid = PRODUCTS.map(function (p) {
          return "<div class=\"product\"><div class=\"cover " + p.cover + "\"><span class=\"ct\">" + esc(p.coverTitle) + "</span><span class=\"cs\">" + esc(p.coverSub) + "</span></div><div><h3>" + esc(p.name) + "</h3><p>" + esc(p.desc) + "</p><span class=\"price\">" + esc(p.price) + "</span><a href=\"" + p.url + "\" target=\"_blank\" rel=\"noopener\">" + esc(p.cta) + "</a></div></div>";
        }).join("");
        var pb = productById("playbook");
        app.innerHTML =
          "<div class=\"start step-anim\">" +
          "<span class=\"start-badge\">Training session complete</span>" +
          "<div class=\"stars\" aria-hidden=\"true\">" + stars + "</div>" +
          "<h1 class=\"grade\">" + grade + "</h1>" +
          "<p class=\"lede\">" + note + "</p>" +
          "<div class=\"result-stats\">" +
          "<span class=\"chip gold\">Final score <b>" + S.score.toLocaleString("en-US") + "</b></span>" +
          "<span class=\"chip\">First try accuracy <b>" + acc + "%</b></span>" +
          "<span class=\"chip\">Best streak <b>" + S.bestStreak + "</b></span>" +
          "<span class=\"chip\">Fees earned <b>" + money(S.fees) + "</b></span>" +
          "<span class=\"chip\">Clients filed <b>" + S.order.length + " of " + S.order.length + "</b></span>" +
          "</div>" +
          "<div class=\"spotlight\">" +
          "<span class=\"ad-kicker\">The next level · From Genextra LLC</span>" +
          "<h2>Enjoying the game? You can do this for real.</h2>" +
          "<p>You just trained the way real preparers learn: interview, documents, Form 1040, credits, verdict. The Tax Preparer Playbook takes you from training cases to a real tax preparation business, clients, fees, season workflow, and all.</p>" +
          "<span class=\"price\">" + esc(pb.price) + "</span>" +
          "<div class=\"row\"><a class=\"btn amber\" href=\"" + pb.url + "\" target=\"_blank\" rel=\"noopener\">Tax Preparer Playbook</a>" +
          "<button class=\"btn ghost\" id=\"again\">Train again</button></div>" +
          "</div>" +
          "<h2 style=\"margin-top:30px; font-size:1.35rem;\">More from Genextra LLC</h2>" +
          "<div class=\"product-grid\">" + grid + "</div>" +
          "<div class=\"creator\">Created by <b>Genextra LLC</b> · Disclaimer: This simulation is based on tax year 2025 tax law. Tax laws change from year to year, so figures may differ in other years.</div>" +
          "</div>";
        document.getElementById("again").addEventListener("click", function () {
          S = newState();
          hud.classList.remove("hidden");
          startClient();
        });
        window.scrollTo(0, 0);
      }

      startScreen();
    </script>
  </body>
</html>
